'澤雷隨-九四': '九四，隨有獲，貞凶。有孚，在道以明，何咎？',
'澤雷隨-九五': '九五，孚于嘉，吉。',
'澤雷隨-上六': '上六，拘係之，乃從維之，王用亨于西山。',
'山風蠱-初六': '初六，幹父之蠱，有子，考无咎，厲終吉。',
'山風蠱-九二': '九二，幹母之蠱，不可貞。',
'山風蠱-九三': '九三，幹父之蠱，小有悔，无大咎。',
'山風蠱-六四': '六四，裕父之蠱，往見吝。',
'山風蠱-六五': '六五，幹父之蠱，用譽。',
'山風蠱-上九': '上九，不事王侯，高尚其事。',
'地澤臨-初九': '初九，咸臨，貞吉。',
'地澤臨-九二': '九二，咸臨，吉，无不利。',
'地澤臨-六三': '六三，甘臨，无攸利。既憂之，无咎。',
'地澤臨-六四': '六四，至臨，无咎。',
'地澤臨-六五': '六五，知臨，大君之宜，吉。',
'地澤臨-上六': '上六，敦臨，吉，无咎。',
'風地觀-初六': '初六，童觀，小人无咎，君子吝。',
'風地觀-六二': '六二，闚觀，利女貞。',
'風地觀-六三': '六三，觀我生，進退。',
'風地觀-六四': '六四，觀國之光，利用賓于王。',
'風地觀-九五': '九五，觀我生，君子无咎。',
'風地觀-上九': '上九，觀其生，君子无咎。',
'火雷噬嗑-初九': '初九，屨校滅趾，无咎。',
'火雷噬嗑-六二': '六二，噬膚，滅鼻，无咎。',
'火雷噬嗑-六三': '六三，噬腊肉，遇毒。小吝无咎。',
'火雷噬嗑-九四': '九四，噬乾胏，得金矢，利艱貞吉。',
'火雷噬嗑-六五': '六五，噬乾肉，得黃金，貞厲无咎。',
'火雷噬嗑-上九': '上九，何校滅耳，凶。',
'山火賁-初九': '初九，賁其趾，舍車而徒。',
'山火賁-六二': '六二，賁其須。',
'山火賁-九三': '九三，賁如濡如，永貞吉。',
'山火賁-六四': '六四，賁如皤如，白馬翰如，匪寇婚媾。',
'山火賁-六五': '六五，賁于丘園，束帛戔戔。吝，終吉。',
'山火賁-上九': '上九，白賁，无咎。',
'山地剝-初六': '初六，剝床以足，蔑貞凶。',
'山地剝-六二': '六二，剝床以辨，蔑貞凶。',
'山地剝-六三': '六三，剝之无咎。',
'山地剝-六四': '六四，剝床以膚，凶。',
'山地剝-六五': '六五，貫魚以宮人寵，无不利。',
'山地剝-上九': '上九，碩果不食，君子得輿，小人剝廬。',
'地雷復-初九': '初九，不遠復，无祇悔，元吉。',
'地雷復-六二': '六二，休復，吉。',
'地雷復-六三': '六三，頻復，厲，无咎。',
'地雷復-六四': '六四，中行獨復。',
'地雷復-六五': '六五，敦復，无悔。',
'地雷復-上六': '上六，迷復，凶，有災眚，用行師，終有大敗。以其國君，凶。至于十年不克征。',
'天雷无妄-初九': '初九，无妄往，吉。',
'天雷无妄-六二': '六二，不耕穫，不菑畬，則利有攸往。',
'天雷无妄-六三': '六三，无妄之災，或繫之牛，行人之得，邑人之災。',
'天雷无妄-九四': '九四，可貞，无咎。',
'天雷无妄-九五': '九五，无妄之疾，勿藥有喜。',
'天雷无妄-上九': '上九，无妄行，有眚，无攸利。',
'山天大畜-初九': '初九，有厲，利已。',
'山天大畜-九二': '九二，輿說輹。',
'山天大畜-九三': '九三，良馬逐，利艱貞。曰閑輿衛，利有攸往。',
'山天大畜-六四': '六四，童牛之牿，元吉。',
'山天大畜-六五': '六五，豶豕之牙，吉。',
'山天大畜-上九': '上九，何天之衢，亨。',
'山雷頤-初九': '初九，舍爾靈龜，觀我朵頤，凶。',
'山雷頤-六二': '六二，顛頤，拂經。于丘頤，征凶。',
'山雷頤-六三': '六三，拂頤，貞凶。十年勿用，无攸利。',
'山雷頤-六四': '六四，顛頤，吉，虎視眈眈，其欲逐逐，无咎。',
'山雷頤-六五': '六五，拂經，居貞吉，不可涉大川。',
'山雷頤-上九': '上九，由頤，厲吉，利涉大川。',
'澤風大過-初六': '初六，藉用白茅，无咎。',
'澤風大過-九二': '九二，枯楊生稊，老夫得其女妻，无不利。',
'澤風大過-九三': '九三，棟橈，凶。',
'澤風大過-九四': '九四，棟隆，吉，有它吝。',
'澤風大過-九五': '九五，枯楊生華，老婦得其士夫，无咎无譽。',
'澤風大過-上六': '上六，過涉滅頂，凶，无咎。',
'坎為水-初六': '初六，習坎，入于坎窞，凶。',
'坎為水-九二': '九二，坎，有險，求小得。',
'坎為水-六三': '六三，來之坎坎，險且枕，入于坎窞，勿用。',
'坎為水-六四': '六四，樽酒，簋貳，用缶，納約自牖，終无咎。',
'坎為水-九五': '九五，坎不盈，祗既平，无咎。',
'坎為水-上六': '上六，係用黴纆，寘于叢棘，三歲不得，凶。',
'離為火-初九': '初九，履錯然，敬之，无咎。',
'離為火-六二': '六二，黃離，元吉。',
'離為火-九三': '九三，日昃之離，不鼓缶而歌，則大耋之嗟，凶。',
'離為火-九四': '九四，突如其來如，焚如，死如，棄如。',
'離為火-六五': '六五，出涕沱若，戚嗟若，吉。',
'離為火-上九': '上九，王用出征，有嘉折首，獲匪其醜，无咎。',
'澤山咸-初六': '初六，咸其拇。',
'澤山咸-六二': '六二，咸其腓，凶，居吉。',
'澤山咸-九三': '九三，咸其股，執其隨，往吝。',
'澤山咸-九四': '九四，貞吉，悔亡，憧憧往來，朋從爾思。',
'澤山咸-九五': '九五，咸其脢，无悔。',
'澤山咸-上六': '上六，咸其輔頰舌。',
'雷風恒-初六': '初六，浚恒，貞凶，无攸利。',
'雷風恒-九二': '九二，悔亡。',
'雷風恒-九三': '九三，不恒其德，或承之羞，貞吝。',
'雷風恒-九四': '九四，田无禽。',
'雷風恒-六五': '六五，恒其德貞，婦人吉，夫子凶。',
'雷風恒-上六': '上六，振恒，凶。',
'天山遯-初六': '初六，遯尾，厲。勿用有攸往。',
'天山遯-六二': '六二，執之用黃牛之革，莫之勝說。',
'天山遯-九三': '九三，係遯，有疾厲，畜臣妾吉。',
'天山遯-九四': '九四，好遯，君子吉，小人否。',
'天山遯-九五': '九五，嘉遯，貞吉。',
'天山遯-上九': '上九，肥遯，无不利。',
'雷天大壯-初九': '初九，壯于趾，征凶，有孚。',
'雷天大壯-九二': '九二，貞吉。',
'雷天大壯-九三': '九三，小人用壯，君子用罔。貞厲，羝羊觸藩，羸其角。',
'雷天大壯-九四': '九四，貞吉，悔亡，藩決不羸，壯于大輿之輹。',
'雷天大壯-六五': '六五，喪羊于易，无悔。',
'雷天大壯-上六': '上六，羝羊觸藩，不能退，不能遂，无攸利，艱則吉。',
'火地晉-初六': '初六，晉如摧如，貞吉。罔孚裕，无咎。',
'火地晉-六二': '六二，晉如愁如，貞吉。受茲介福，于其王母。',
'火地晉-六三': '六三，眾允，悔亡。',
'火地晉-九四': '九四，晉如鼫鼠，貞厲。',
'火地晉-六五': '六五，悔亡，失得勿恤。往吉无不利。',
'火地晉-上九': '上九，晉其角，維用伐邑。厲吉无咎，貞吝。',
'地火明夷-初九': '初九，明夷于飛，垂其翼。君子于行，三日不食。有攸往，主人有言。',
'地火明夷-六二': '六二，明夷，夷于左股，用拯馬壯吉。',
'地火明夷-九三': '九三，明夷于南狩，得其大首，不可疾貞。',
'地火明夷-六四': '六四，入于左腹，獲明夷之心，于出門庭。',
'地火明夷-六五': '六五，箕子之明夷，利貞。',
'地火明夷-上六': '上六，不明晦，初登于天，後入于地。',
'風火家人-初九': '初九，閑有家，悔亡。',
'風火家人-六二': '六二，无攸遂，在中饋，貞吉。',
'風火家人-九三': '九三，家人嗃嗃，悔厲吉，婦子嘻嘻，終吝。',
'風火家人-六四': '六四，富家，大吉。',
'風火家人-九五': '九五，王假有家，勿恤，吉。',
'風火家人-上九': '上九，有孚，威如，終吉。',
'火澤睽-初九': '初九，悔亡，喪馬勿逐，自復。見惡人，无咎。',
'火澤睽-九二': '九二，遇主于巷，无咎。',
'火澤睽-六三': '六三，見輿曳，其牛掣，其人天且劓，无初有終。',
'火澤睽-九四': '九四，睽孤，遇元夫。交孚，厲无咎。',
'火澤睽-六五': '六五，悔亡。厥宗噬膚，往何咎。',
'火澤睽-上九': '上九，睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾。往，遇雨則吉。',
'水山蹇-初六': '初六，往蹇來譽。',
'水山蹇-六二': '六二，王臣蹇蹇，匪躬之故。',
'水山蹇-九三': '九三，往蹇來反。',
'水山蹇-六四': '六四，往蹇來連。',
'水山蹇-九五': '九五，大蹇朋來。',
'水山蹇-上六': '上六，往蹇來碩，吉，利見大人。',
'雷水解-初六': '初六，无咎。',
'雷水解-九二': '九二，田獲三狐，得黃矢，貞吉。',
'雷水解-六三': '六三，負且乘，致寇至，貞吝。',
'雷水解-九四': '九四，解而拇，朋至斯孚。',
'雷水解-六五': '六五，君子維有解，吉，有孚于小人。',
'雷水解-上六': '上六，公用射隼于高墉之上，獲之，无不利。',
'山澤損-初九': '初九，已事遄往，无咎，酌損之。',
'山澤損-九二': '九二，利貞，征凶。弗損，益之。',
'山澤損-六三': '六三，三人行，則損一人，一人行，則得其友。',
'山澤損-六四': '六四，損其疾，使遄有喜，无咎。',
'山澤損-六五': '六五，或益之十朋之龜，弗克違，元吉。',
'山澤損-上九': '上九，弗損，益之，无咎，貞吉，利有攸往，得臣无家。',
'風雷益-初九': '初九，利用為大作，元吉，无咎。',
'風雷益-六二': '六二，或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。',
'風雷益-六三': '六三，益之用凶事，无咎。有孚中行，告公用圭。',
'風雷益-六四': '六四，中行，告公從，利用為依遷國。',
'風雷益-九五': '九五，有孚惠心，勿問元吉。有孚惠我德。',
'風雷益-上九': '上九，莫益之，或擊之，立心勿恒，凶。',
'澤天夬-初九': '初九，壯于前趾，往不勝為咎。',
'澤天夬-九二': '九二，惕號，莫夜有戎，勿恤。',
'澤天夬-九三': '九三，壯于頄，有凶。君子夬夬，獨行，遇雨若濡。有慍无咎。',
'澤天夬-九四': '九四，臀无膚，其行次且，牽羊悔亡，聞言不信。',
'澤天夬-九五': '九五，莧陸夬夬，中行无咎。',
'澤天夬-上六': '上六，无號，終有凶。',
'天風姤-初六': '初六，繫于金柅，貞吉。有攸往，見凶。羸豕孚蹢躅。',
'天風姤-九二': '九二，包有魚，无咎，不利賓。',
'天風姤-九三': '九三，臀无膚，其行次且，厲，无大咎。',
'天風姤-九四': '九四，包无魚，起凶。',
'天風姤-九五': '九五，以杞包瓜，含章，有隕自天。',
'天風姤-上九': '上九，姤其角，吝，无咎。',
'澤地萃-初六': '初六，有孚不終，乃亂乃萃，若號。一握為笑，勿恤，往无咎。',
'澤地萃-六二': '六二，引吉，无咎，孚乃利用禴。',
'澤地萃-六三': '六三，萃如嗟如，无攸利。往无咎，小吝。',
'澤地萃-九四': '九四，大吉，无咎。',
'澤地萃-九五': '九五，萃有位，无咎，匪孚。元永貞，悔亡。',
'澤地萃-上六': '上六，齎咨涕洟，无咎。',
'地風升-初六': '初六，允升，大吉。',
'地風升-九二': '九二，孚乃利用禴，无咎。',
'地風升-九三': '九三，升虛邑。',
'地風升-六四': '六四，王用亨于岐山，吉，无咎。',
'地風升-六五': '六五，貞吉，升階。',
'地風升-上六': '上六，冥升，利于不息之貞。',
'澤水困-初六': '初六，臀困于株木，入于幽谷，三歲不覿。',
'澤水困-九二': '九二，困于酒食，朱紱方來，利用享祀，征凶，无咎。',
'澤水困-六三': '六三，困于石，據于蒺蔾，入于其宮，不見其妻，凶。',
'澤水困-九四': '九四，來徐徐，困于金車。吝，有終。',
'澤水困-九五': '九五，劓刖，困于赤紱，乃徐有說。利用祭祀。',
'澤水困-上六': '上六，困于葛藟，于臲卼，曰動悔有悔，征吉。',
'水風井-初六': '初六，井泥不食，舊井无禽。',
'水風井-九二': '九二，井谷射鮒，甕敝漏。',
'水風井-九三': '九三，井渫不食，為我心惻，可用汲。王明，並受其福。',
'水風井-六四': '六四，井甃无咎。',
'水風井-九五': '九五，井冽，寒泉食。',
'水風井-上六': '上六，井收勿幕，有孚元吉。',
'澤火革-初九': '初九，鞏用黃牛之革。',
'澤火革-六二': '六二，已日乃革之，征吉，无咎。',
'澤火革-九三': '九三，征凶，貞厲，革言三就，有孚。',
'澤火革-九四': '九四，悔亡，有孚，改命吉。',
'澤火革-九五': '九五，大人虎變，未占有孚。',
'澤火革-上六': '上六，君子豹變，小人革面，征凶，居貞吉。',
'火風鼎-初六': '初六，鼎顛趾，利出否，得妾以其子，无咎。',
'火風鼎-九二': '九二，鼎有實，我仇有疾，不我能即，吉。',
'火風鼎-九三': '九三，鼎耳革，其行塞，雉膏不食。方雨虧悔，終吉。',
'火風鼎-九四': '九四，鼎折足，覆公餗，其形渥，凶。',
'火風鼎-六五': '六五，鼎黃耳金鉉，利貞。',
'火風鼎-上九': '上九，鼎玉鉉，大吉，无不利。',
'震為雷-初九': '初九，震來虩虩，後笑言啞啞，吉。',
'震為雷-六二': '六二，震來厲，億喪貝，躋于九陵。勿逐，七日得。',
'震為雷-六三': '六三，震蘇蘇，震行无眚。',
'震為雷-九四': '九四，震遂泥。',
'震為雷-六五': '六五，震往來厲，億无喪，有事。',
'震為雷-上六': '上六，震索索，視矍矍，征凶。震不于其躬于其鄰，无咎。婚媾有言。',

    // 陰陽反轉函式
    function flipYao(yao) {
      return yao === '陽' ? '陰' : '陽';
    }

    // 陣列比較工具
    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    // 由爻陰陽陣列找卦名
    function findGuaByYao(yaoArr) {
      for (const [guaName, yaoPattern] of Object.entries(guaYaoMap)) {
        if (arraysEqual(yaoArr, yaoPattern)) {
          return guaName;
        }
      }
      return null;
    }

    // 動爻位置判斷與名稱
    function getMovingYaoInfo(moveNum) {
      if (moveNum >= 1 && moveNum <= 3) {
        return {
          guaType: '下卦',
          yaoIndex: moveNum - 1,
          yaoName: yaoNameList[moveNum - 1],
          yaoPosition: moveNum // 1~3 對應初爻~三爻
        };
      } else if (moveNum >= 4 && moveNum <= 6) {
        return {
          guaType: '上卦',
          yaoIndex: moveNum - 4,
          yaoName: yaoNameList[moveNum - 1],
          yaoPosition: moveNum // 4~6 對應四爻~上爻
        };
      }
      return null;
    }

   function getYaoText(originalYao, yaoPosition) {
  const yaoNum = originalYao === '陽' ? 9 : 6;
  const yaoPrefixMap = {
    1: '初', 2: '二', 3: '三', 4: '四', 5: '五', 6: '上'
  };

  const yaoName = yaoPrefixMap[yaoPosition];

  // ✅ 初與上放前面，其它是數字在前
  if (yaoPosition === 1 || yaoPosition === 6) {
    return yaoName + (yaoNum === 9 ? '九' : '六');  // 初九、上六
  } else {
    return (yaoNum === 9 ? '九' : '六') + yaoName;  // 九二、六五...
  }
}
function updateResults() {
  const n1 = parseInt(document.getElementById('num1').value);
  const n2 = parseInt(document.getElementById('num2').value);
  const n3 = parseInt(document.getElementById('num3').value);
  const question = document.getElementById('questionInput').value.trim();


  // 計算下卦
  let r1 = isNaN(n1) ? null : n1 % 8;
  if (r1 === 0 && !isNaN(n1)) r1 = 8;
  const gua1 = guaMap[r1] || '';
  const name1 = guaNameMap[gua1] || '';

  // 計算上卦
  let r2 = isNaN(n2) ? null : n2 % 8;
  if (r2 === 0 && !isNaN(n2)) r2 = 8;
  const gua2 = guaMap[r2] || '';
  const name2 = guaNameMap[gua2] || '';

  // 動爻
  let r3 = isNaN(n3) ? null : n3 % 6;
  if (r3 === 0 && !isNaN(n3)) r3 = 6;

  // 顯示第一格卦名
  if (gua1) {
    document.getElementById('res1').textContent = gua1 + '(' + name1 + ')';
  } else {
    document.getElementById('res1').textContent = '';
  }
  // 顯示第二格卦名
  if (gua2) {
    document.getElementById('res2').textContent = gua2 + '(' + name2 + ')';
  } else {
    document.getElementById('res2').textContent = '';
  }

  // 動爻文字
  const movingInfo = getMovingYaoInfo(r3);
  let yaoText = '';
  if (movingInfo) {
    yaoText = `動${movingInfo.yaoName}`;
    document.getElementById('res3').textContent = yaoText;
  } else {
    document.getElementById('res3').textContent = '';
  }

  // 若只有第一格有數字（沒第二格），output不顯示任何文字
  if (gua1 && !gua2) {
    document.getElementById('output').textContent = '';
    return;
  }

  // 若第一格和第二格任一無效，提醒輸入正確
  if (!gua1 || !gua2) {
    document.getElementById('output').textContent = '請輸入正確的上卦與下卦數字（1-8）';
    return;
  }

  // 若動爻無效，且兩格都有數字，顯示無動爻的卦象文字
  if (!movingInfo) {
    const combo = name2 + name1;
    const hexName = hexagramMap[combo] || '（未知卦名）';
    const guaciText = guaciMap[hexName] || '';

    const outputText =
      `問卦：${question ? question : ''}\n` +
      `卦象：\n` +
      `${hexName}卦(上${name2}下${name1})` + (guaciText ? `-- ${guaciText}` : '') + `\n` +
      `幫我解釋卦辭、卦義跟分析`;

    document.getElementById('output').textContent = outputText;
    return;
  }

  // 有動爻時的原本計算與顯示 (保持你之前的邏輯)
  const combo = name2 + name1;
  const hexName = hexagramMap[combo] || '（未知卦名）';

  let lowerYao = guaYaoMap[gua1].slice();
  let upperYao = guaYaoMap[gua2].slice();

  let changedLowerYao = lowerYao.slice();
  let changedUpperYao = upperYao.slice();

  let changedGua = '';
  let changedHexName = '';

  let originalYao = null;

  if (movingInfo.guaType === '下卦') {
    originalYao = lowerYao[movingInfo.yaoIndex];
    changedLowerYao[movingInfo.yaoIndex] = flipYao(changedLowerYao[movingInfo.yaoIndex]);
    changedGua = findGuaByYao(changedLowerYao);
    changedHexName = hexagramMap[name2 + guaNameMap[changedGua]] || '（未知卦名）';
  } else if (movingInfo.guaType === '上卦') {
    originalYao = upperYao[movingInfo.yaoIndex];
    changedUpperYao[movingInfo.yaoIndex] = flipYao(changedUpperYao[movingInfo.yaoIndex]);
    changedGua = findGuaByYao(changedUpperYao);
    changedHexName = hexagramMap[guaNameMap[changedGua] + name1] || '（未知卦名）';
  }

  const yaoValueText = getYaoText(originalYao, r3);

  const guaciText = guaciMap[hexName] || '';
  const yaociText = yaociMap[`${hexName}-${yaoValueText}`] || '';
  const changedGuaciText = guaciMap[changedHexName] || '';

  const changedLowerName = guaNameMap[changedGua] || '';
  const changedUpperName = movingInfo.guaType === '下卦' ? name2 : guaNameMap[changedGua] || '';

  const outputText =
    `問卦：${question ? question : ''}\n` +
    `卦象：\n` +
    `${hexName}卦(上${name2}下${name1})` + (guaciText ? `-- ${guaciText}` : '') + `\n` +
    `${yaoText}(${yaoValueText})` + (yaociText ? `-- ${yaociText}` : '') + `\n` +
    `變${changedHexName}卦(上${movingInfo.guaType === '下卦' ? name2 : changedUpperName}下${movingInfo.guaType === '下卦' ? changedLowerName : name1})` + (changedGuaciText ? `-- ${changedGuaciText}` : '') + `\n` +
    `幫我解釋卦辭、卦義跟分析`;

  document.getElementById('output').textContent = outputText;
}
// ✅ 把 clearInputs 放這裡
function clearInputs() {
  document.getElementById('num1').value = '';
  document.getElementById('num2').value = '';
  document.getElementById('num3').value = '';
  document.getElementById('questionInput').value = '';
  document.getElementById('res1').textContent = '';
  document.getElementById('res2').textContent = '';
  document.getElementById('res3').textContent = '';
  document.getElementById('output').textContent = '';
}


function copyOutput() {
  const text = document.getElementById('output').textContent;
  if (!text) {
    document.getElementById('copyStatus').textContent = '沒有可複製的內容';
    return;
  }

  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copyStatus').textContent = '已複製！';
    setTimeout(() => {
      document.getElementById('copyStatus').textContent = '';
    }, 2000);
  }).catch(() => {
    document.getElementById('copyStatus').textContent = '複製失敗';
  });
}
